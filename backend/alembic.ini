# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(slug)s

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.tzstr()
# leave blank for localtime
# timezone =

# max length of characters to apply to the "slug"
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to run the environment during
# the 'check' command, regardless of autogenerate
# check_sentinel = false

# set to 'true' to run the environment during
# the 'initialize' command, regardless of autogenerate
# initialize_environment = false

# version location specification; this defaults
# to the environment's local source tree.
# version_locations = %(here)s/alembic/versions

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

# database URL is configured from app.config.settings in env.py
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.
# This config can be used to set a branch name to be used when revision
# is generated. The branch name can be different from the default branch.
# branch_name =
# format using "%%(slug)s" to escape special characters
# hook =
# hook = %(here)s/venv/bin/alembic-check
# hook = %(here)s/venv/bin/python -m black
# hook = %(here)s/venv/bin/python -m ruff check --fix

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

datefmt = %Y-%m-%d %H:%M:%S
